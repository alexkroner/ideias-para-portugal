</style></head><body><div id="ip-demo"><div class="demo-bar"><span><strong>Demonstração privada</strong> · Sem publicação na Internet</span><label>Perfil de teste <select id="ip-profile" aria-label="Selecionar perfil de teste"><option value="alex">Alex</option><option value="ines">Inês</option><option value="miguel">Miguel</option></select></label></div><header class="header"><button class="brand" data-page="explore" aria-label="Ideias para Portugal, início"><span class="brandmark"><span></span><span></span><span></span></span><span>ideias para<span class="brandbottom">portugal<span class="dot">.</span></span></span></button><nav aria-label="Navegação principal"><button data-page="explore" data-nav="explore">Explorar ideias</button><button data-page="rankings" data-nav="rankings">Rankings</button><button data-page="mine" data-nav="mine">As minhas ideias</button><button data-page="how" data-nav="how">Como funciona</button></nav><div class="header-actions"><button class="primary small" data-page="new">Propor uma ideia</button></div></header><div id="ip-status" role="status" aria-live="polite"></div><main id="ip-main"></main><footer><span class="footer-brand">ideias para portugal.</span><span id="ip-storage"></span></footer></div><script>const DEMO_SEEDS=[{"id": "demo-saude", "title": "Uma lista de espera única para consultas e cirurgias", "description": "Criar uma plataforma nacional que permita aos utentes consultar os tempos de espera e escolher uma unidade do SNS com disponibilidade, com apoio à deslocação quando necessário.", "area": "Saúde"}, {"id": "demo-educacao", "title": "Literacia financeira desde o ensino básico", "description": "Integrar no currículo exercícios práticos sobre poupança, juros, impostos e orçamento familiar, adaptados à idade dos alunos e sem promoção de produtos comerciais.", "area": "Educação"}, {"id": "demo-habitacao", "title": "Recuperar edifícios públicos para arrendamento acessível", "description": "Inventariar os imóveis públicos devolutos e publicar um plano de recuperação, com metas, custos e critérios transparentes de acesso ao arrendamento.", "area": "Habitação"}, {"id": "demo-economia", "title": "Um balcão único para quem quer criar uma empresa", "description": "Reunir licenças, obrigações fiscais e apoios num único percurso digital, com informação clara sobre prazos e um ponto de contacto para acompanhar cada pedido.", "area": "Economia"}, {"id": "demo-mobilidade", "title": "Um passe que ligue transportes de todo o país", "description": "Permitir viajar em diferentes operadores com um único suporte, começando pela interoperabilidade dos passes regionais e pela informação integrada de horários.", "area": "Mobilidade"}, {"id": "demo-ambiente", "title": "Mais sombra e árvores nas ruas das nossas cidades", "description": "Priorizar a plantação de árvores nas zonas com maior exposição ao calor, com espécies adequadas, manutenção garantida e acompanhamento público dos resultados.", "area": "Ambiente"}, {"id": "demo-estado", "title": "Acompanhar cada pedido ao Estado, do início ao fim", "description": "Dar a cada pedido um número de acompanhamento, um prazo de resposta e um histórico de alterações, acessível a partir de um único portal.", "area": "Estado e serviços públicos"}, {"id": "demo-justica", "title": "Linguagem clara nas comunicações dos tribunais", "description": "Acompanhar notificações judiciais com um resumo simples que explique o que foi decidido, os prazos aplicáveis e as ações que o destinatário pode tomar.", "area": "Justiça"}, {"id": "demo-defesa", "title": "Reforçar a preparação para emergências e ciberataques", "description": "Criar exercícios regulares entre proteção civil, serviços públicos e infraestruturas críticas, com relatórios públicos sobre aprendizagens e melhorias.", "area": "Defesa"}];
(()=>{
const root=document.getElementById('ip-demo');
const $=s=>root.querySelector(s);
const areas=['Economia','Saúde','Educação','Habitação','Ambiente','Mobilidade','Justiça','Defesa','Estado e serviços públicos'];
const people={alex:'Alex',ines:'Inês',miguel:'Miguel'};
const key='ideias-portugal-demo-v1';
let memoryOnly=false;
function seed(){return {ideas:DEMO_SEEDS.map((i,n)=>({...i,example:true,author:['Inês','Miguel','Alex'][n%3],owner:['ines','miguel','alex'][n%3],created:Date.now()-(n+1)*86400000})),votes:DEMO_SEEDS.reduce((a,i,n)=>{a[i.id]={};for(let j=0;j<12-n;j++)a[i.id]['demo-'+j]=(j%5===0?-1:1);return a},{}),profile:'alex'}}
let state;try{state=JSON.parse(localStorage.getItem(key)||'null');if(!state||!Array.isArray(state.ideas)||!state.votes||!people[state.profile])state=seed()}catch{state=seed();memoryOnly=true}
let page='explore',area='Todas as áreas',query='',order='score',selected=null,toast='',resetAsk=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const score=i=>Object.values(state.votes[i.id]||{}).reduce((a,b)=>a+b,0);
const totals=i=>{const v=Object.values(state.votes[i.id]||{});return [v.filter(x=>x===1).length,v.filter(x=>x===-1).length]};
function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch{memoryOnly=true}storageLabel()}
function storageLabel(){const e=$('#ip-storage');if(e)e.textContent=memoryOnly?'Dados apenas nesta sessão. Este contexto não permite gravação no navegador.':'Dados de teste guardados neste navegador. Não são partilhados entre dispositivos.'}
function notify(t){toast=t;$('#ip-status').textContent=t}
function sorted(list){return [...list].sort((a,b)=>order==='recent'?b.created-a.created:order==='votes'?(totals(b)[0]+totals(b)[1])-(totals(a)[0]+totals(a)[1]):score(b)-score(a)||totals(b)[0]-totals(a)[0]||a.created-b.created)}
function voted(i){return state.votes[i.id]?.[state.profile]||0}
function voter(i){return `<div class="voter"><button data-vote="1" data-id="${esc(i.id)}" aria-label="Votar a favor de ${esc(i.title)}" aria-pressed="${voted(i)===1}">↑</button><strong>${score(i)}</strong><button data-vote="-1" data-id="${esc(i.id)}" aria-label="Votar contra ${esc(i.title)}" aria-pressed="${voted(i)===-1}">↓</button></div>`}
function card(i,n){const [up,down]=totals(i);return `<article class="idea-card">${voter(i)}<div class="idea-content"><div class="card-meta"><span class="badge">${esc(i.area)}</span><span class="example">${i.example?'Demonstração':'A tua proposta de teste'}</span><span class="rank">#${n+1}</span></div><button class="idea-title" data-open="${esc(i.id)}">${esc(i.title)}</button><p>${esc(i.description)}</p><div class="card-foot"><span class="author-avatar">${esc(i.author[0])}</span><span>${esc(i.author)}</span><span>· ${up} a favor · ${down} contra</span><button class="detail-link" data-open="${esc(i.id)}">Ver proposta ↗</button></div></div></article>`}
function filterOptions(){return `<option>Todas as áreas</option>${areas.map(a=>`<option ${a===area?'selected':''}>${esc(a)}</option>`).join('')}`}
function filters(){return `<div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="ip-query" aria-label="Pesquisar ideias" placeholder="Pesquisar uma ideia ou tema..." value="${esc(query)}"></label><label class="sort"><span class="sr">Ordenar por</span><select id="ip-order"><option value="score" ${order==='score'?'selected':''}>Mais votadas</option><option value="recent" ${order==='recent'?'selected':''}>Mais recentes</option><option value="votes" ${order==='votes'?'selected':''}>Mais votações</option></select></label></div>`}
function list(){let rows=state.ideas.filter(i=>(area==='Todas as áreas'||i.area===area)&&(page!=='mine'||i.owner===state.profile)&&(i.title+' '+i.description).toLocaleLowerCase('pt').includes(query.toLocaleLowerCase('pt')));return rows.length?sorted(rows).map(card).join(''):`<div class="empty"><h3>Nenhuma ideia encontrada.</h3><p>Experimenta outra pesquisa ou apresenta uma nova proposta.</p><button class="primary" data-page="new">Propor uma ideia</button></div>`}
function main(){
if(page==='new')return `<section class="form-page"><button class="back" data-page="explore">← Voltar às ideias</button><div class="eyebrow">UMA PROPOSTA CONCRETA FAZ A DIFERENÇA</div><h2>O que propões para Portugal?</h2><p class="intro">Estás a participar como <strong>${people[state.profile]}</strong>, um perfil de demonstração.</p><form id="ip-form"><label>Título da ideia<input name="title" required minlength="10" maxlength="120" placeholder="Uma mudança concreta, numa frase"></label><label>Área<select name="area" required><option value="">Seleciona uma área</option>${areas.map(a=>`<option ${a===area?'selected':''}>${a}</option>`).join('')}</select></label><label>A tua proposta<textarea name="description" required minlength="40" maxlength="2000" rows="6" placeholder="O que deve mudar? Como funcionaria? Quem beneficiaria?"></textarea></label><p class="form-note">Entre 40 e 2000 caracteres. Nesta demonstração, os dados ficam neste navegador. Evita dados pessoais reais.</p><p id="ip-form-error" role="alert"></p><button class="primary" type="submit">Submeter ideia ↗</button></form></section>`;
if(page==='detail'){const i=state.ideas.find(i=>i.id===selected);if(!i){page='explore';return main()}const [up,down]=totals(i);return `<section class="form-page"><button class="back" data-page="explore">← Voltar às ideias</button><div class="card-meta"><span class="badge">${esc(i.area)}</span><span class="example">${i.example?'Proposta de demonstração':'Proposta de teste'}</span></div><h2>${esc(i.title)}</h2><p class="full-description">${esc(i.description)}</p><div class="detail-voting">${voter(i)}<div><strong>${up} a favor · ${down} contra</strong><p>Saldo: ${score(i)} votos. Participas como ${people[state.profile]}.</p><p>${voted(i)?'Já votaste. Podes alterar ou retirar o teu voto.':'Usa as setas para votar nesta proposta.'}</p></div></div><p class="form-note">Proposta de ${esc(i.author)} · ${new Date(i.created).toLocaleDateString('pt-PT')}</p></section>`}
if(page==='how')return `<section class="form-page"><div class="eyebrow">COMO FUNCIONA</div><h2>Experimenta a participação, do início ao fim.</h2><div class="steps"><h3>1. Propõe uma medida</h3><p>Escolhe uma área e explica uma mudança concreta. A proposta surge imediatamente nas ideias e no ranking da respetiva categoria.</p><h3>2. Vota</h3><p>A seta para cima vale +1 e a seta para baixo vale −1. Clicar na mesma seta retira o voto. Clicar na outra altera o sentido. Cada perfil tem um voto por ideia.</p><h3>3. Explora os rankings</h3><p>O saldo corresponde aos votos a favor menos os votos contra. Em caso de empate, prevalece o número de votos a favor e depois a proposta mais antiga.</p><h3>4. Simula outros participantes</h3><p>Muda o perfil no topo para Alex, Inês ou Miguel. Os votos de cada perfil são independentes. Esta seleção simula utilizadores, sem autenticação real.</p><h3>Dados de demonstração</h3><p>As propostas iniciais e os votos são fictícios. As ideias que acrescentares ficam marcadas como propostas de teste. ${memoryOnly?'Os dados duram apenas enquanto esta pré-visualização estiver aberta.':'Os dados ficam no navegador, enquanto não limpares o armazenamento ou repuseres a demonstração.'}</p></div><div class="principles">Esta versão é uma demonstração local, sem publicação, contas reais ou partilha de dados entre participantes em dispositivos diferentes.</div><div class="reset-box"><button class="secondary" data-reset-ask>Repor dados de demonstração</button>${resetAsk?'<p>Esta ação elimina as ideias e os votos acrescentados nesta demonstração.</p><button class="primary" data-reset-confirm>Confirmar reposição</button><button class="secondary" data-reset-cancel>Cancelar</button>':''}</div></section>`;
if(page==='rankings')return `<section class="explore"><div class="section-head"><div><div class="eyebrow">AS IDEIAS MAIS APOIADAS, ÁREA A ÁREA</div><h2>Rankings por categoria</h2><p>O saldo de votos determina a posição de cada proposta.</p></div></div><div class="ranking-grid">${areas.map(a=>{const list=state.ideas.filter(i=>i.area===a).sort((x,y)=>score(y)-score(x)||totals(y)[0]-totals(x)[0]||x.created-y.created);return `<section class="ranking-panel"><div class="ranking-head"><h3>${a}</h3><span>${list.length} ideias</span></div>${list.slice(0,3).map((i,n)=>`<button class="ranking-row" data-open="${esc(i.id)}"><span>${n+1}</span><strong>${esc(i.title)}</strong><b>${score(i)}</b></button>`).join('')||'<p>Ainda não há ideias nesta área.</p>'}<button class="area-link" data-area="${a}">Ver todas as ideias de ${a} →</button></section>`}).join('')}</div></section>`;
return `${page==='explore'?`<section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="live-dot"></span> UM ESPAÇO PARA FAZER AVANÇAR PORTUGAL</div><h1>O país que queremos<br>começa com <em>uma ideia.</em></h1><p>Partilha propostas, vota nas medidas em que acreditas<br>e ajuda a construir um ranking de ideias para Portugal.</p><div class="hero-buttons"><button class="primary" data-page="new">Partilhar uma ideia ↗</button><button class="text-link" data-scroll>Descobrir ideias ↓</button></div><p class="hero-note">Versão de demonstração. Propostas e votos iniciais fictícios.</p></div><div class="hero-art" aria-hidden="true"><div class="orbit orbit-one"></div><div class="paper paper-back"></div><div class="paper paper-front"><div class="paper-top"><span class="tiny-mark">ip.</span><span>UMA IDEIA PODE<br>FAZER A DIFERENÇA.</span></div><div class="bulb">?</div><div class="paper-rule"></div><div class="paper-bottom">Mais participação.<br>Mais possibilidades.</div></div><div class="floating-vote">↑ A tua voz conta.</div></div></section>`:''}<section class="explore" id="ip-ideas"><div class="section-head"><div><div class="eyebrow">${page==='mine'?'A TUA PARTICIPAÇÃO':'IDEIAS COM ESPAÇO PARA CRESCER'}</div><h2>${page==='mine'?'As minhas ideias':'O que podemos fazer melhor?'}</h2><p>${page==='mine'?'Propostas do perfil '+people[state.profile]+'.':'Explora as propostas e ajuda a decidir quais devem subir.'}</p></div></div><div class="board"><aside><h3>Explorar por área</h3>${['Todas as áreas',...areas].map(a=>`<button data-area="${a}" class="category ${a===area?'selected':''}"><span>${a}</span><small>${state.ideas.filter(i=>a==='Todas as áreas'||i.area===a).length}</small></button>`).join('')}<div class="aside-note"><span>O teu olhar faz falta.</span><p>Uma experiência do dia a dia pode ser o início de uma boa proposta.</p><button data-page="new">Partilha a tua ideia →</button></div></aside><div class="feed">${filters()}<div class="feed-tabs"><strong>${esc(area)}</strong><span>Saldo = votos a favor − votos contra</span></div><div id="ip-results">${list()}</div></div></div></section>`}
function render(){
$('#ip-profile').value=state.profile;
root.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));
$('#ip-main').innerHTML=main();storageLabel();$('#ip-status').textContent=toast;
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.page){page=b.dataset.page;query='';resetAsk=false;render();$('#ip-main').scrollIntoView({block:'start',behavior:'smooth'})}
else if(b.dataset.open){selected=b.dataset.open;page='detail';render();$('#ip-main').scrollIntoView({block:'start',behavior:'smooth'})}
else if(b.dataset.area){area=b.dataset.area;if(page==='rankings')page='explore';render();$('#ip-ideas')?.scrollIntoView({block:'start',behavior:'smooth'})}
else if(b.dataset.vote){const id=b.dataset.id,value=Number(b.dataset.vote);if(!state.votes[id])state.votes[id]={};if(state.votes[id][state.profile]===value)delete state.votes[id][state.profile];else state.votes[id][state.profile]=value;persist();render();notify('Voto atualizado para o perfil '+people[state.profile]+'.')}
else if(b.hasAttribute('data-scroll'))$('#ip-ideas')?.scrollIntoView({behavior:'smooth'});
else if(b.hasAttribute('data-reset-ask')){resetAsk=true;render()}
else if(b.hasAttribute('data-reset-cancel')){resetAsk=false;render()}
else if(b.hasAttribute('data-reset-confirm')){state=seed();persist();resetAsk=false;render();notify('Dados de demonstração repostos.')}
});
root.addEventListener('input',e=>{if(e.target.id==='ip-query'){query=e.target.value;$('#ip-results').innerHTML=list()}});
root.addEventListener('change',e=>{if(e.target.id==='ip-profile'){state.profile=e.target.value;persist();render();notify('Perfil de teste: '+people[state.profile]+'.')}else if(e.target.id==='ip-order'){order=e.target.value;$('#ip-results').innerHTML=list()}});
root.addEventListener('submit',e=>{if(e.target.id!=='ip-form')return;e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')).trim(),description=String(f.get('description')).trim(),a=String(f.get('area'));if(title.length<10||title.length>120||description.length<40||description.length>2000||!areas.includes(a)){$('#ip-form-error').textContent='Verifica os campos: título com 10 a 120 caracteres, descrição com 40 a 2000 e uma área.';return}const id='local-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);state.ideas.push({id,title,description,area:a,author:people[state.profile],owner:state.profile,created:Date.now(),example:false});persist();page='detail';selected=id;render();notify('Ideia submetida. Já está disponível no ranking de '+a+'.');});
persist();render();
})();
</script></body></html>
